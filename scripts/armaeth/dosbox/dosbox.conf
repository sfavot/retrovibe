# Configuration DOSBox-X du banc d'essai d'Armaeth (voir run.sh). Les chemins, le lecteur C: et l'AUTOEXEC sont
# ajoutés par run.sh dans un second fichier (-conf répété) ; ce fichier ne contient que le matériel émulé.

[sdl]
output=surface

[dosbox]
# VGA seul : le pilote VGA.EXE exige un adaptateur VGA couleur et pilote le DAC / le contrôleur d'attributs en direct.
machine=vgaonly
memsize=16

[cpu]
# Interpréteur sans recompilation : le plus déterministe. 486 DX2/66 d'époque : environ 25 000 cycles par ms
# dans DOSBox (repères de la documentation de DOSBox : 386 DX/33 = 8 000, 486 DX/33 = 12 000, 486 DX2/66 = 25 000,
# Pentium 60 = 50 000). Surchargeable par run.sh -c. Le jeu est cadencé sur le retour vertical (70 Hz) : le nombre
# de cycles ne compte que s'il est trop bas pour finir une image en 14 ms (mesuré dans docs/armaeth/dosbox.md).
core=normal
cputype=486
cycles=fixed 25000

[sblaster]
# Pas de son numérique dans le jeu : seulement l'OPL2 (AdLib, ports 388h/389h). Une Sound Blaster 2.0 fournit
# un OPL2 mono et rien d'autre que le jeu sache détecter ; le MPU-401 est coupé pour que le pilote musical
# n'hésite pas entre AdLib et MIDI.
sbtype=sb2
oplmode=opl2
sbbase=220
irq=7
dma=1

[midi]
mpu401=none

[speaker]
pcspeaker=false

[dos]
ver=6.22
# Pas de souris : le jeu se joue au clavier, et sans pilote INT 33h il ne risque pas d'attendre un relâchement de bouton.
int33=false
